.t2{font-family:Arial,Helvetica,sans-serif}.t2 .rt{color:#0b5563;font-weight:700;font-size:1.25em}.t2 h2{color:#0b5563;border-bottom:1px solid #b9cdd1;padding-bottom:3px}
.t3{font-family:Calibri,Carlito,Arial,sans-serif}.t3 h1{color:#14213d}.t3 h2{background:#e9eef3;color:#14213d;padding:3px 8px}
#rp{display:none}
@media print{@page{size:A4;margin:14mm}html,body{background:#fff!important;background-image:none!important}:root{padding:0!important}.wrap,.bar,#toast{display:none!important}#rp{display:block}#rp .rv{padding:0;border-radius:0;font-size:10.5pt}}

<body>
<div class="wrap">
<header class="top"><div class="brand"><img src="/icon.svg" width="34" height="34" alt="" style="border-radius:11px;display:block"><span>CareerGuru <i>AI</i></span></div><button class="av" id="av" data-go="profile" aria-label="Profile"></button></header>

</div>

<script>
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=x=>Array.isArray(x)?x:[];
const n=x=>Math.max(0,Math.min(100,Math.round(+x)||0));
const md=s=>e(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n').map(l=>/^\s*[-•*] /.test(l)?'<li>'+l.replace(/^\s*[-•*] /,'')+'</li>':l.trim()?'<p>'+l+'</p>':'').join('');
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};
const S={tab:'home',p:ld('cg_p',{}),r:ld('cg_r',{}),f:ld('cg_f',{}),chat:ld('cg_c',[]),busy:false,del:false,am:'in',msg:'',em:'',rec:false,ses:null,user:null};
const IC={home:'M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',career:'M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z',resume:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8',job:'M4 7h16v13H4zM9 7V4h6v3',chat:'M4 4h16v12H8l-4 4z',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',mic:'M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3zM6 11a6 6 0 0012 0M12 17v4'};
const ico=k=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[k]||IC.mic}"/></svg>`;
const TABS=[['home','Home'],['career','Career'],['resume','Resume'],['job','Jobs'],['interview','Interview'],['chat','Chat']];
const F=[['name','Name'],['degree','Degree (e.g. BSc)'],['branch','Branch / subject'],['year','Year of study'],['college','College'],['skills','Skills (comma separated)','t'],['interests','Interests','t'],['exp','Experience','t'],['certs','Certifications','t'],['role','Target job role'],['salary','Expected salary'],['loc','Preferred location']];
const LG=['English','Telugu-English mix'];
const pstr=()=>F.map(([k,l])=>S.p[k]?l+': '+S.p[k]:'').filter(Boolean).join('\n');
const newIv=()=>({cfg:{role:'',level:'Fresher',diff:'Medium',type:'HR'},phase:'setup',qs:[],i:0,draft:''});
S.iv=ld('cg_iv',null)||newIv();S.rbT=ld('cg_rbt','');
const LOAD={resume_build:'Building your resume…',career:'Analyzing your career profile…',resume:'Analyzing your resume…',job:'Matching you with this job…'};
const ERR='We couldn’t complete the analysis right now. Please try again.';
const Q=['I’m BSc Computer Science final year. I know basic Python and video editing. What should I do?','How do I get my first job without experience?','What should I put in a fresher’s resume summary?'];
const lang=()=>/telugu|hinglish/i.test(S.p.lang||'')?'Telugu-English mix':'English';
const SB={url:'',key:''};
const MAP={name:'name',degree:'degree',branch:'branch',year:'year',college:'college',skills:'skills',interests:'interests',exp:'experience',certs:'certs',role:'target_role',salary:'expected_salary',loc:'preferred_location',lang:'language'};
const sbf=(p,o,t)=>fetch(SB.url+p,{...o,headers:{apikey:SB.key,'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{}),...((o&&o.headers)||{})}});
const chk=async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw {message:j.error_description||j.msg||j.message||ERR};return j};
function setSes(j){S.ses={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000};if(j.user)S.user=j.user;sv('cg_s',{...S.ses,user:S.user})}
async function tok(){
  if(!S.ses)throw {code:'auth'};
  if(Date.now()>S.ses.exp){const r=await sbf('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:S.ses.refresh_token})});if(!r.ok){await wipe(false);throw {code:'auth'}}setSes(await r.json())}
  return S.ses.access_token}
async function api(feature,input,extra){
  const t=await tok(),ac=new AbortController(),to=setTimeout(()=>ac.abort(),90000);
  try{const r=await fetch('/api/ai',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({feature,input,lang:lang(),...extra})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw {code:j.code||'fail',message:j.error||ERR,detail:j.detail};return j.result}
  finally{clearTimeout(to)}}
async function docxText(f){
  const b=new Uint8Array(await f.arrayBuffer()),v=new DataView(b.buffer);
  let q=-1;for(let i=b.length-22;i>=Math.max(0,b.length-70000);i--)if(v.getUint32(i,true)===0x06054b50){q=i;break}
  if(q<0)throw {message:'This DOCX could not be read. Save it as PDF and upload that.'};
  let p=v.getUint32(q+16,true);const n=v.getUint16(q+10,true);
  for(let k=0;k<n;k++){
    const meth=v.getUint16(p+10,true),csz=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    if(new TextDecoder().decode(b.subarray(p+46,p+46+nl))==='word/document.xml'){
      const lh=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true);let d=b.subarray(lh,lh+csz);
      if(meth===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      return new TextDecoder().decode(d).replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<w:br\/>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/\n{3,}/g,'\n\n').trim()}
    p+=46+nl+el+cl}
  throw {message:'No text found in this DOCX. Try saving it as PDF.'}}
async function readResume(f){
  const n=f.name.toLowerCase();
  try{
    if(n.endsWith('.doc'))throw {message:'Old .doc files are not supported. Save it as PDF or DOCX.'};
    if(f.size>1.5*1024*1024)throw {message:'File is too large. Use a file under 1.5 MB.'};
    if(n.endsWith('.pdf')||f.type==='application/pdf'){
      const b=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
      S.file={name:f.name,mime:'application/pdf',data:btoa(s)};S.f.resume='';sv('cg_f',S.f);toast('PDF ready. Tap Analyze resume.')}
    else{S.file=null;S.f.resume=(n.endsWith('.docx')?await docxText(f):await f.text()).slice(0,12000);sv('cg_f',S.f);toast(S.f.resume.trim().length<80?'Very little text found. Check the file.':'Resume loaded.')}
  }catch(x){toast(x.message||'Could not read that file.')}
  render()}
const avatarHtml=px=>S.av?`<img src="${S.av}" alt="Profile photo" style="width:${px}px;height:${px}px;border-radius:50%;object-fit:cover;display:block">`:`<div style="width:${px}px;height:${px}px;border-radius:50%;display:grid;place-items:center;background:var(--s);border:1px solid var(--bd);font-weight:800;font-size:${Math.round(px/2.4)}px">${e((S.p.name||'').trim().charAt(0).toUpperCase()||'☺')}</div>`;
async function loadAvatar(){
  try{const t=await tok();const r=await sbf('/storage/v1/object/authenticated/avatars/'+S.user.id+'/avatar.jpg',{},t);
    if(S.av){URL.revokeObjectURL(S.av);S.av=null}
    if(r.ok)S.av=URL.createObjectURL(await r.blob())}catch(x){}
  render()}
async function squareJpeg(f){
  const bmp=await createImageBitmap(f),s=Math.min(bmp.width,bmp.height),c=document.createElement('canvas');c.width=c.height=256;
  c.getContext('2d').drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,256,256);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no({message:'Could not read that image.'}),'image/jpeg',.85))}
async function setPhoto(f){
  if(!f)return;
  try{
    if(!/^image\//.test(f.type))throw {message:'Please choose an image.'};
    const b=await squareJpeg(f),t=await tok();
    const r=await fetch(SB.url+'/storage/v1/object/avatars/'+S.user.id+'/avatar.jpg',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'image/jpeg','x-upsert':'true'},body:b});
    if(!r.ok)throw {message:'Could not save your photo. Try again.'};
    toast('Photo updated.');await loadAvatar()
  }catch(x){toast(x.message||'Could not read that image.')}}
async function rmPhoto(){
  try{await sbf('/storage/v1/object/avatars/'+S.user.id+'/avatar.jpg',{method:'DELETE'},await tok())}catch(x){}
  if(S.av){URL.revokeObjectURL(S.av);S.av=null}toast('Photo removed.');render()}
const IVN=5,SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const ivSave=()=>sv('cg_iv',{...S.iv,busy:'',err:''});
const ivCtx=()=>{const c=S.iv.cfg;return `ROLE: ${c.role||S.p.role}\nLEVEL: ${c.level}\nDIFFICULTY: ${c.diff}\nINTERVIEW TYPE: ${c.type}\nTOTAL: ${IVN}`};
async function ivAct(a){
  const v=S.iv;
  if(a==='ivreset'){if(S.mic)S.mic.stop();S.iv=newIv();ivSave();return render()}
  if(a==='ivmic')return ivMic();
  if(a==='ivstart'){
    const c=v.cfg;if(!(c.role||S.p.role||'').trim())return toast('Enter the job role first.');
    v.busy='start';v.err='';v.retry='ivstart';render();
    try{const r=await api('iv_start',ivCtx()+`\nPROFILE:\n${pstr()}${c.type==='Resume-based'&&S.f.resume?'\nRESUME:\n'+S.f.resume.slice(0,3000):''}`);
      S.iv={...v,session:r.session,qs:[{question:r.question,tip:r.tip}],i:0,phase:'ask',draft:'',busy:'',err:''}}
    catch(x){v.busy='';v.err=x.message||ERR}
    ivSave();return render()}
  if(a==='ivanswer'){
    const q=v.qs[v.i],ans=(v.draft||'').trim();if(ans.length<15)return toast('Write a little more (at least a couple of sentences).');
    if(S.mic)S.mic.stop();
    v.busy='turn';v.err='';v.retry='ivanswer';render();
    const prev=v.qs.slice(0,v.i).map((p,k)=>`Q${k+1}: ${p.question}\nA${k+1}: ${p.answer}\nScore: ${p.score}/10`).join('\n\n');
    try{const r=await api('iv_turn',`${ivCtx()}\nQUESTION_NUMBER: ${v.i+1}\n\nPREVIOUS:\n${prev||'(none)'}\n\nCURRENT QUESTION: ${q.question}\nCANDIDATE ANSWER: ${ans}`,{session:v.session});
      Object.assign(q,{answer:ans,score:Math.max(0,Math.min(10,+r.score||0)),good:r.good,missing:r.missing,improve:r.improve,better:r.better_answer});
      v.next=r.next_question?{question:r.next_question,tip:r.next_tip}:null;v.phase='fb';v.busy='';v.err=''}
    catch(x){v.busy='';v.err=x.message||ERR}
    ivSave();return render()}
  if(a==='ivnext'){if(!v.next)return;v.qs.push(v.next);v.next=null;v.i++;v.phase='ask';v.draft='';ivSave();scrollTo(0,0);return render()}
  if(a==='ivreport'){
    v.busy='report';v.err='';v.retry='ivreport';render();
    const all=v.qs.map((p,k)=>`Q${k+1}: ${p.question}\nA${k+1}: ${p.answer}\nScore: ${p.score}/10`).join('\n\n');
    try{const r=await api('iv_report',`${ivCtx()}\n\n${all}`,{session:v.session});v.report=r;v.phase='report';S.r.interview=r;sv('cg_r',S.r);v.busy='';v.err=''}
    catch(x){v.busy='';v.err=x.message||ERR}
    ivSave();return render()}}
function ivMic(){
  if(!SRC)return toast('Voice input is not supported in this browser. Please type your answer.');

  const hit=kw.filter(k=>tx.includes(k.toLowerCase())),miss=kw.filter(k=>!tx.includes(k.toLowerCase())),sc=kw.length?Math.round(hit.length/kw.length*100):0;
  return `<div class="card"><div class="row">${ring(sc)}<div><b>Job keyword match</b><p class="mu">${hit.length} of ${kw.length} keywords from the job description are in your resume.</p></div></div>${miss.length?`<p class="mu">Missing. Add them only if they are true for you:</p>${tags(miss)}`:'<p class="mu">All keywords covered.</p>'}</div><h2 class="h2">Choose a template</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">${RBT.map(([k,nm,s])=>`<button class="q" style="${t===k?'border-color:var(--a2)':''}" data-act="rbt-${k}" aria-pressed="${t===k}">${nm}${k===rec?'<span class="tag">Recommended</span>':''}<span class="mu" style="font-weight:400;font-size:12px">${s}</span></button>`).join('')}</div><div id="rv" style="margin:12px 0">${rbHtml(d,t)}</div><button class="btn" data-act="rbpdf">Download PDF</button><p class="mu">Tap Download PDF, then choose “Save as PDF”. Read every line before you apply.</p>`}
V.rb=()=>`<button class="btn g chip" style="width:auto" data-go="resume">← Back</button><h1 class="h">Resume Builder</h1><p class="mu">Name, degree, skills and experience come from your Profile.${S.p.name&&S.p.skills?'':' <b>Fill your Profile first.</b>'}</p><div class="card"><label class="lb">Job title you are applying for<input data-f="rb_title" data-s="f" value="${e(S.f.rb_title||'')}" placeholder="e.g. Junior Web Developer"></label><label class="lb">Job description (paste it)<textarea data-f="jd" data-s="f" rows="7" maxlength="6000">${e(S.f.jd||'')}</textarea></label></div><div class="card"><b>Contact details</b><label class="lb">Phone<input data-f="rb_phone" data-s="f" value="${e(S.f.rb_phone||'')}" inputmode="tel"></label><label class="lb">City, State<input data-f="rb_city" data-s="f" value="${e(S.f.rb_city||'')}"></label><label class="lb">Email (blank = your login email)<input data-f="rb_email" data-s="f" value="${e(S.f.rb_email||'')}" inputmode="email"></label><label class="lb">Links: LinkedIn, GitHub, portfolio (one per line)<textarea data-f="rb_links" data-s="f" rows="3">${e(S.f.rb_links||'')}</textarea></label></div><div class="card"><b>Projects and extras</b><label class="lb">Projects: name, tech used, what you built<textarea data-f="rb_proj" data-s="f" rows="6" maxlength="2500">${e(S.f.rb_proj||'')}</textarea></label><label class="lb">CGPA, study years, achievements (optional)<textarea data-f="rb_extra" data-s="f" rows="3" maxlength="1500">${e(S.f.rb_extra||'')}</textarea></label></div><button class="btn" data-act="rbgen">Build my resume</button><div id="out">${rbOut()}</div>`;
function rbPrint(){
  const v=$('#rv');if(!v)return;let p=$('#rp');if(!p){p=document.createElement('div');p.id='rp';document.body.appendChild(p)}
  p.innerHTML=v.innerHTML;const t=document.title;document.title=(S.p.name||'Resume').replace(/[^\w ]/g,'')+' - Resume';
  window.onafterprint=()=>{document.title=t;p.innerHTML=''};window.print()}
function rbAct(a){
  if(a.startsWith('rbt-')){S.rbT=a.slice(4);sv('cg_rbt',S.rbT);return render()}
  if(a==='rbpdf')return rbPrint();
  if(!S.p.name||!S.p.skills)return toast('Fill your name and skills in Profile first.');
  if((S.f.jd||'').trim().length<40)return toast('Paste the job description first.');
  if(!(S.f.rb_title||'').trim())return toast('Enter the job title first.');
  S.rbT='';sv('cg_rbt','');
  const c=(k,m)=>String(S.f[k]||'').slice(0,m);
  return run('resume_build',`TARGET JOB TITLE: ${c('rb_title',100)}\n\nJOB DESCRIPTION:\n${c('jd',4500)}\n\nPROFILE:\n${pstr()}\n\nPROJECTS (written by the candidate):\n${c('rb_proj',2500)||'(none)'}\n\nEXTRA DETAILS (CGPA, years, achievements):\n${c('rb_extra',1500)||'(none)'}\n\nEXISTING RESUME:\n${c('resume',2500)||'(none)'}`)}

function render(){
  $('#app').innerHTML=(S.user&&!S.rec?V[S.tab]:V.auth)();
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-go="${k}" class="${S.tab===k?'on':''}" ${S.tab===k?'aria-current="page"':''}>${ico(k)}${l}</button>`).join('');
  $('#av').innerHTML=S.av?'<img src="'+S.av+'" alt="Profile" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block">':e((S.p.name||'').trim().charAt(0).toUpperCase()||'☺');
  $('#nav').style.display=$('#av').style.display=S.user&&!S.rec?'':'none';
}
function go(t){S.tab=t;S.del=false;render();scrollTo(0,0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
function upd(){const el=$('#msgs');if(el){el.innerHTML=msgs();if(el.lastElementChild)el.lastElementChild.scrollIntoView({block:'end'})}}
async function send(m){
  if(S.busy)return;S.busy=true;S.chat.push({r:'u',t:m},{r:'a',t:''});
  if(S.tab!=='chat')go('chat');else render();upd();
  const last=S.chat[S.chat.length-1];
  try{
    last.t=await api('chat',m,{history:S.chat.slice(-12,-2).map(x=>({r:x.r,t:x.t})),profile:pstr()});
  }catch(x){last.t=x&&x.code==='limit'?x.message:ERR+(x&&x.detail?' ['+x.detail+']':'');last.err=true}
  S.busy=false;sv('cg_c',S.chat.slice(-30));if(S.tab==='chat'){render();upd()}
}
function act(a){
  if(a==='resume_build'||a.startsWith('rb'))return rbAct(a==='resume_build'?'rbgen':a);
  if(a==='prof')return go('profile');
  if(a.startsWith('iv'))return ivAct(a);
  if(a==='career')return run('career',pstr());
  if(a==='resume'){if(!S.file&&(S.f.resume||'').trim().length<80)return toast('Paste your resume text or upload a file first.');return run('resume',`RESUME:\n${S.file?'(see the attached PDF)':S.f.resume}\n\nPROFILE:\n${pstr()}`,S.file?{file:{mime:S.file.mime,data:S.file.data}}:undefined)}
  if(a==='job'){if((S.f.jd||'').trim().length<40)return toast('Paste the job description first.');return run('job',`JOB DESCRIPTION:\n${S.f.jd}\n\nPROFILE:\n${pstr()}\n\nRESUME:\n${S.f.resume||'(not provided)'}`)}
  if(a==='send'){const v=(S.f.chat||'').trim();if(!v)return toast('Type your question first.');S.f.chat='';sv('cg_f',S.f);return send(v)}
  if(a==='rc'){const m=S.chat[S.chat.length-2].t;S.chat.splice(-2);return send(m)}
  if(a==='del'){if(!S.del){S.del=true;return render()}return wipe(true)}
  if(a==='out')return wipe(false);
  if(a==='auth')return doAuth();
  if(a==='gsoon')return toast('Google sign-in is coming soon.');
  if(a==='google'){location.href=SB.url+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin);return}
  if(a==='rmphoto')return rmPhoto();
  if(a.startsWith('am-')){S.am=a.slice(3);S.msg='';return render()}
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-act],[data-q]');if(!t)return;
  const d=t.dataset;
  if(d.go)return d.go==='soon'?toast('Coming soon — Interview Coach is next.'):go(d.go);
  if(d.q)return send(d.q);
  act(d.act);
});
document.addEventListener('input',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.f;if(!k)return;
  if(t.dataset.s==='iv'){S.iv.draft=t.value;return}if(t.dataset.s==='ivc'){S.iv.cfg[k]=t.value;return}if(t.dataset.s==='p'){S.p[k]=t.value;sv('cg_p',S.p);saveProfile()}else{S.f[k]=t.value;sv('cg_f',S.f)}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='photo'){setPhoto(ev.target.files[0]);ev.target.value='';return}
  if(ev.target.id!=='file')return;
  const f=ev.target.files[0];if(!f)return;
  readResume(f);
});
(async()=>{
  const sx=ld('cg_s',null);if(sx&&sx.access_token){S.ses={access_token:sx.access_token,refresh_token:sx.refresh_token,exp:sx.exp};S.user=sx.user}
  render();
  try{const c=await (await fetch('/api/config')).json();SB.url=c.url;SB.key=c.key;
    try{const st=await (await fetch(SB.url+'/auth/v1/settings',{headers:{apikey:SB.key}})).json();S.gOn=!!(st.external&&st.external.google)}catch(x){}
    const h=new URLSearchParams(location.hash.slice(1));
    if(h.get('access_token')){setSes({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:+h.get('expires_in')||3600});
      history.replaceState(null,'',location.pathname);
      S.user=await sbf('/auth/v1/user',{},S.ses.access_token).then(r=>r.json());sv('cg_s',{...S.ses,user:S.user});
      if(h.get('type')==='recovery')S.rec=true}
    else if(h.get('error_description')){S.msg=h.get('error_description');history.replaceState(null,'',location.pathname)}
    if(S.user&&!S.rec)await loadProfile();
  }catch(x){S.msg='We couldn’t connect. Please refresh the page.'}
  render()})();
</script>
</body>
</html>
